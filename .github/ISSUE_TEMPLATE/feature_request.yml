name: 功能请求 / Feature Request
description: 提出新 skill 或现有能力改进 / Suggest a new skill or improve an existing capability
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索现有 issues，并检查是否已有 skill 覆盖该场景。
        Search existing issues and check whether an existing skill already covers the scenario.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Pre-submission Checklist
      options:
        - label: 我已搜索现有 issues，此功能尚未被提出 / I have searched existing issues and this feature has not been requested
          required: true
        - label: 我已阅读相关 skills 或项目文档 / I have read the relevant skills or project documentation
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem Statement
      description: 哪个使用场景存在缺口或重复劳动？/ What workflow has a gap or repetitive work?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 描述期望的行为、范围、不包含的内容及可验证的验收标准 / Describe expected behavior, scope, non-goals, and verifiable acceptance criteria
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: 是否可通过现有 skill 或更小改动满足需求？/ Could an existing skill or a smaller change meet the need?

  - type: dropdown
    id: category
    attributes:
      label: 功能分类 / Feature Category
      options:
        - 新增 Skill / New Skill
        - 现有 Skill 改进 / Existing Skill Improvement
        - 开发工作流 / Development Workflow
        - 文档与知识组织 / Documentation and Knowledge Organization
        - Agent 工具与集成 / Agent Tools and Integrations
        - Evals 与验证 / Evals and Validation
        - 分组与分发 / Grouping and Distribution
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景 / Use Case
      description: 提供典型输入、预期输出或调用示例 / Provide typical input, expected output, or an invocation example

  - type: textarea
    id: additional
    attributes:
      label: 附加信息 / Additional Context
      description: 相关 skill 名称、文件路径、参考资料或截图 / Relevant skill names, file paths, references, or screenshots
